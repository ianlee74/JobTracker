# Build check on GitHub-hosted runners — this is what runs for pull requests
# (including forks), so nothing from a PR ever executes on the home server.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Syntax-check server modules
        run: |
          for f in server/*.js; do node --check "$f"; done
      - name: Auth & role smoke tests
        run: npm test
